name: Deploy PIER to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare-worker/**"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: pier-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run regression checks
        run: pnpm test

      - name: Build beta site assets
        run: pnpm run build:site

      - name: Apply D1 v25 migration when needed
        shell: bash
        run: |
          if pnpm exec wrangler d1 execute travel-claims-reminders --remote --config cloudflare-worker/wrangler.jsonc --command "SELECT channel FROM installations LIMIT 0; SELECT channel, excluded_from_aggregates FROM telemetry_installations LIMIT 0; SELECT channel FROM bug_reports LIMIT 0; SELECT channel FROM site_customization LIMIT 0;" >/dev/null 2>&1; then
            echo "D1 v25 migration is already present."
          else
            pnpm exec wrangler d1 execute travel-claims-reminders --remote --config cloudflare-worker/wrangler.jsonc --file cloudflare-worker/migrate-v25.sql
          fi

      - name: Deploy live Worker
        run: pnpm exec wrangler deploy --config cloudflare-worker/wrangler.jsonc --keep-vars

      - name: Deploy beta Worker and assets
        run: pnpm exec wrangler deploy --config cloudflare-worker/wrangler.beta.jsonc --keep-vars

      - name: Verify public endpoints
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://travel-claims-ics.n-e-alwaa.workers.dev/api/site-config | grep -q '"channel":"live"'
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://pier-beta.n-e-alwaa.workers.dev/api/site-config | grep -q '"channel":"beta"'
