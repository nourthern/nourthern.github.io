name: Validate and deploy PIER

on:
  pull_request:
    branches: [main, beta]
    paths:
      - "cloudflare-worker/**"
      - "dashboard-assets/**"
      - "app-parts/**"
      - "icons/**"
      - "template/**"
      - "vendor/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.json"
      - "sw.js"
      - "scripts/build-site.mjs"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloudflare.yml"
  push:
    branches: [beta]
    paths:
      - "cloudflare-worker/**"
      - "dashboard-assets/**"
      - "app-parts/**"
      - "icons/**"
      - "template/**"
      - "vendor/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.json"
      - "sw.js"
      - "scripts/build-site.mjs"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character commit SHA already verified on beta"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY LIVE to confirm the production release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pier-cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run regression checks
        run: pnpm test

      - name: Build site assets
        run: pnpm run build:site

  deploy_beta:
    name: Deploy beta
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: beta
      url: https://beta.pier.bynour.uk
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out verified beta commit
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site assets
        run: pnpm run build:site

      - name: Deploy beta Worker and assets
        run: pnpm exec wrangler deploy --config cloudflare-worker/wrangler.beta.jsonc --keep-vars

      - name: Verify beta public endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 https://pier-beta.n-e-alwaa.workers.dev/api/site-config | grep -q '"channel":"beta"'
          test "$(curl --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' https://beta.pier.bynour.uk/ics)" = "400"

  deploy_production:
    name: Deploy production
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pier.bynour.uk
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify exact beta-to-main promotion
        shell: bash
        run: |
          test "$RELEASE_CONFIRMATION" = "DEPLOY LIVE"
          case "$RELEASE_SHA" in
            [0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]) ;;
            *) echo "release_sha must be a full 40-character commit SHA" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main beta
          candidate="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse origin/main)"
          beta_sha="$(git rev-parse origin/beta)"
          test "$candidate" = "$RELEASE_SHA"
          test "$main_sha" = "$RELEASE_SHA"
          test "$beta_sha" = "$RELEASE_SHA"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site assets
        run: pnpm run build:site

      - name: Apply D1 v25 migration when needed
        shell: bash
        run: |
          if pnpm exec wrangler d1 execute travel-claims-reminders --remote --config cloudflare-worker/wrangler.jsonc --command "SELECT channel FROM installations LIMIT 0; SELECT channel, excluded_from_aggregates FROM telemetry_installations LIMIT 0; SELECT channel FROM bug_reports LIMIT 0; SELECT channel FROM site_customization LIMIT 0;" >/dev/null 2>&1; then
            echo "D1 v25 migration is already present."
          else
            pnpm exec wrangler d1 execute travel-claims-reminders --remote --config cloudflare-worker/wrangler.jsonc --file cloudflare-worker/migrate-v25.sql
          fi

      - name: Apply D1 v26 migration when needed
        shell: bash
        run: |
          if pnpm exec wrangler d1 execute travel-claims-reminders --remote --config cloudflare-worker/wrangler.jsonc --command "SELECT first_seen_at, device_type, claims_created FROM telemetry_installations LIMIT 0; SELECT channel FROM telemetry_suppressions LIMIT 0; SELECT preview_token FROM site_customization_drafts LIMIT 0; SELECT channel FROM site_customization_backups LIMIT 0;" >/dev/null 2>&1; then
            echo "D1 v26 migration is already present."
          else
            pnpm exec wrangler d1 execute travel-claims-reminders --remote --config cloudflare-worker/wrangler.jsonc --file cloudflare-worker/migrate-v26.sql
          fi

      - name: Deploy live Worker
        run: pnpm exec wrangler deploy --config cloudflare-worker/wrangler.jsonc --keep-vars

      - name: Verify live public endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --max-time 30 https://travel-claims-ics.n-e-alwaa.workers.dev/api/site-config | grep -q '"channel":"live"'
