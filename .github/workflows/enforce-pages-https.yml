name: Enforce PIER HTTPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "CNAME"
      - "index.html"
      - ".github/workflows/enforce-pages-https.yml"

permissions:
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require HTTPS for GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" --field https_enforced=true

      - name: Verify HTTPS enforcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .https_enforced)" = "true"
