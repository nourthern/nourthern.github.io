<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Claims Manager</title>
    <!-- ical.js for parsing ICS files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <!-- jsPDF for exporting the claim form -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background: #0056b3; color: white; }
        .tab-content { display: none; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        input, select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('setup')">1. Setup</button>
        <button class="tab-btn" onclick="switchTab('shifts')">2. Shifts</button>
        <button class="tab-btn" onclick="switchTab('claim')">3. Claim Form</button>
        <button class="tab-btn" onclick="switchTab('log')">4. Expense Log</button>
    </div>

    <!-- Tab 1: Setup -->
    <div id="setup" class="tab-content active">
        <h2>Personal & Commute Details</h2>
        <div class="form-grid" oninput="saveSetup()">
            <div class="form-group"><label>Full Name</label><input type="text" id="fullName"></div>
            <div class="form-group"><label>Base Site</label>
                <select id="baseSite">
                    <option value="DPOW">DPOW (DN33 2BA)</option>
                    <option value="SGH">SGH (DN15 7BH)</option>
                </select>
            </div>
            <div class="form-group"><label>Job Title (Designation)</label><input type="text" id="designation" placeholder="e.g., IMT2 Doctor"></div>
            <div class="form-group"><label>Home Address & Postcode</label><input type="text" id="homeAddress"></div>
            <div class="form-group"><label>Job Role Number</label><input type="text" id="roleNumber" pattern="[0-9\-]{8,}"></div>
            <div class="form-group"><label>Vehicle Reg (e.g. SK11 NNT)</label><input type="text" id="vehicleReg"></div>
            <div class="form-group"><label>Engine CC</label><input type="number" id="engineCC" placeholder="e.g., 1300"></div>
            <div class="form-group"><label>Claimable Miles (per trip)</label><input type="number" id="claimableMiles"></div>
            <div class="form-group"><label>Passenger Miles (Optional)</label><input type="number" id="passengerMiles"></div>
            <div class="form-group"><label>Average Commute (Mins)</label><input type="number" id="commuteMins"></div>
            <div class="form-group"><label>Misc Commute Cost (£)</label><input type="number" id="miscCost" step="0.01"></div>
            <div class="form-group"><label>Misc Type</label>
                <select id="miscType">
                    <option value="Toll">Toll Road</option>
                    <option value="Bus">Bus</option>
                    <option value="Train">Train</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Tab 2: Shifts -->
    <div id="shifts" class="tab-content">
        <h2>ICS Calendar Importer</h2>
        <input type="text" id="icsUrl" placeholder="Paste ICS URL here" style="width: 70%;">
        <button onclick="fetchICS()">Fetch & Parse Shifts</button>
        <table id="shiftsTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Shift</th>
                    <th>Status / Override</th>
                </tr>
            </thead>
            <tbody id="shiftsBody"></tbody>
        </table>
    </div>

    <!-- Tab 3: Claim Form -->
    <div id="claim" class="tab-content">
        <h2>Monthly Claim Preview</h2>
        <button onclick="generatePDF()">Export to PDF</button>
        <button onclick="submitClaim()" style="background: #007bff;">Mark as Submitted</button>
        <table id="claimTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Start Time</th>
                    <th>Reason</th>
                    <th>End Time</th>
                    <th>Miles</th>
                    <th>Misc (£)</th>
                </tr>
            </thead>
            <tbody id="claimBody"></tbody>
        </table>
    </div>

    <!-- Tab 4: Expense Log -->
    <div id="log" class="tab-content">
        <h2>Expense Log</h2>
        <table id="logTable">
            <thead>
                <tr>
                    <th>Date Submitted</th>
                    <th>Date Range</th>
                    <th>Miles Owed (£0.30/m)</th>
                    <th>Misc Owed</th>
                    <th>Total Sum</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="logBody"></tbody>
            <tfoot>
                <tr><td colspan="4"><b>Cumulative Total</b></td><td colspan="2"><b id="cumulativeTotal">£0.00</b></td></tr>
            </tfoot>
        </table>
    </div>

    <script>
        // Tab Navigation
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            if(tabId === 'claim') buildClaimTable();
            if(tabId === 'log') loadExpenseLog();
        }

        // Auto-Save Setup Data via LocalStorage
        function saveSetup() {
            const inputs = document.querySelectorAll('#setup input, #setup select');
            let data = {};
            inputs.forEach(input => data[input.id] = input.value);
            localStorage.setItem('setupData', JSON.stringify(data));
        }

        function loadSetup() {
            const data = JSON.parse(localStorage.getItem('setupData'));
            if (data) {
                for (const key in data) {
                    if (document.getElementById(key)) {
                        document.getElementById(key).value = data[key];
                    }
                }
            }
        }

        // Fetch & Parse ICS
        async function fetchICS() {
            const url = document.getElementById('icsUrl').value;
            if (!url) return alert('Please enter an ICS URL');
            try {
                // Using a CORS proxy to bypass cross-origin restrictions
                const response = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
                const icsData = await response.text();
                parseICS(icsData);
            } catch (err) {
                alert('Error fetching ICS: ' + err.message);
            }
        }

        function parseICS(data) {
            const jcalData = ICAL.parse(data);
            const comp = new ICAL.Component(jcalData);
            const events = comp.getAllSubcomponents('vevent');
            let parsedShifts = [];

            events.forEach(event => {
                const vevent = new ICAL.Event(event);
                parsedShifts.push({
                    date: vevent.startDate.toJSDate(),
                    summary: vevent.summary,
                    start: vevent.startDate.toJSDate(),
                    end: vevent.endDate.toJSDate(),
                    status: 'Normal'
                });
            });
            
            parsedShifts.sort((a, b) => a.date - b.date);
            localStorage.setItem('shiftData', JSON.stringify(parsedShifts));
            renderShifts(parsedShifts);
        }

        function renderShifts(shifts) {
            const tbody = document.getElementById('shiftsBody');
            tbody.innerHTML = '';
            shifts.forEach((shift, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${new Date(shift.date).toLocaleDateString()}</td>
                        <td>${shift.summary}</td>
                        <td>
                            <select onchange="updateShiftStatus(${index}, this.value)">
                                <option value="Normal">Normal</option>
                                <option value="Sick">Sick Leave</option>
                                <option value="Annual">Annual Leave</option>
                                <option value="Unscheduled">Unscheduled/Swap</option>
                            </select>
                        </td>
                    </tr>`;
            });
        }

        // Build Claim Table logic
        function buildClaimTable() {
            const setup = JSON.parse(localStorage.getItem('setupData')) || {};
            const shifts = JSON.parse(localStorage.getItem('shiftData')) || [];
            const tbody = document.getElementById('claimBody');
            tbody.innerHTML = '';

            const commuteMins = parseInt(setup.commuteMins) || 0;
            
            shifts.forEach(shift => {
                if(shift.status === 'Sick' || shift.status === 'Annual') return;

                let sTime = new Date(shift.start);
                sTime.setMinutes(sTime.getMinutes() - commuteMins);
                
                let eTime = new Date(shift.end);
                eTime.setMinutes(eTime.getMinutes() + commuteMins);

                // Work Bound
                tbody.innerHTML += `
                    <tr>
                        <td>${sTime.toLocaleDateString()}</td>
                        <td>R</td>
                        <td>${sTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                        <td>Work bound, Day</td>
                        <td>-</td>
                        <td>${setup.claimableMiles || 0}</td>
                        <td>${setup.miscCost || 0}</td>
                    </tr>`;
                
                // Home Bound
                tbody.innerHTML += `
                    <tr>
                        <td>${eTime.toLocaleDateString()}</td>
                        <td>R</td>
                        <td>-</td>
                        <td>Home bound, Day</td>
                        <td>${eTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                        <td>${setup.claimableMiles || 0}</td>
                        <td>${setup.miscCost || 0}</td>
                    </tr>`;
            });
        }

        // Generate PDF imitating the specific NHS Trust format
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const setup = JSON.parse(localStorage.getItem('setupData')) || {};

            doc.setFontSize(10);
            doc.text("NORTHERN LINCOLNSHIRE & GOOLE HOSPITALS NHS TRUST", 14, 15);
            doc.text("BUSINESS AND SUNDRY TRAVELLING EXPENSES", 14, 20);
            
            doc.text(`Name: ${setup.fullName || ''}`, 14, 30);
            doc.text(`Base: ${setup.baseSite || ''}`, 100, 30);
            doc.text(`Designation: ${setup.designation || ''}`, 14, 35);
            doc.text(`Vehicle Reg: ${setup.vehicleReg || ''}`, 100, 35);

            doc.autoTable({
                html: '#claimTable',
                startY: 50,
                theme: 'grid',
                headStyles: { fillColor: [242, 242, 242], textColor: 0 }
            });
            
            doc.text("CLAIMS MUST BE SUBMITTED TO THE PAYROLL DEPARTMENT ON A MONTHLY BASIS", 14, doc.lastAutoTable.finalY + 10);
            doc.text("TO BE RECEIVED BY THE 5TH OF THE FOLLOWING MONTH", 14, doc.lastAutoTable.finalY + 15);
            
            doc.save("Travel Claim Form.pdf");
        }

        // Expense Log Logic
        function submitClaim() {
            let log = JSON.parse(localStorage.getItem('expenseLog')) || [];
            const setup = JSON.parse(localStorage.getItem('setupData')) || {};
            const shifts = JSON.parse(localStorage.getItem('shiftData')) || [];
            
            // Rough calculation for prototype
            let miles = shifts.length * 2 * (setup.claimableMiles || 0);
            let misc = shifts.length * 2 * (setup.miscCost || 0);
            let owedMiles = miles * 0.30;
            
            log.push({
                date: new Date().toLocaleDateString(),
                range: "Current Month",
                milesOwed: owedMiles,
                miscOwed: misc,
                total: owedMiles + misc
            });
            
            localStorage.setItem('expenseLog', JSON.stringify(log));
            alert("Claim saved to Expense Log");
            switchTab('log');
        }

        function loadExpenseLog() {
            let log = JSON.parse(localStorage.getItem('expenseLog')) || [];
            const tbody = document.getElementById('logBody');
            tbody.innerHTML = '';
            let cumTotal = 0;

            log.forEach((entry, i) => {
                cumTotal += entry.total;
                tbody.innerHTML += `
                    <tr>
                        <td>${entry.date}</td>
                        <td>${entry.range}</td>
                        <td>£${entry.milesOwed.toFixed(2)}</td>
                        <td>£${entry.miscOwed.toFixed(2)}</td>
                        <td>£${entry.total.toFixed(2)}</td>
                        <td><button onclick="deleteLog(${i})">Delete</button></td>
                    </tr>`;
            });
            document.getElementById('cumulativeTotal').innerText = `£${cumTotal.toFixed(2)}`;
        }

        window.onload = loadSetup;
    </script>
</body>
</html>
